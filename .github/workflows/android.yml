name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "models-out/**"
      - "release/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # setup-android@v3 fails on current images: it installs the legacy `tools`
      # package, which no longer exists. Use the preinstalled SDK instead.
      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          CMDLINE="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$CMDLINE" ] || CMDLINE="$(command -v sdkmanager)"
          yes | "$CMDLINE" --licenses > /dev/null || true
          "$CMDLINE" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch sherpa-onnx native libraries
        run: bash tools/fetch_sherpa.sh

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: voice-translator-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
